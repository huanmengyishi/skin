name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test

# 说明：
# - 单元/契约/集成矩阵（vitest）与 typecheck/build 为 CI 范围；不依赖 GPU/API/浏览器。
# - 真实 Vision/DeepSeek 链与浏览器 E2E 属本地/定时验收（依赖 provider 凭据与 Harness 实例），不进入普通 CI。
